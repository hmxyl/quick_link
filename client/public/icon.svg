<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 深蓝圆角背景 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#1e3a8a"/>
  <!-- 太阳光芒 (8 根, 圆头) -->
  <g stroke="#fbbf24" stroke-width="16" stroke-linecap="round">
    <line x1="128" y1="50"  x2="128" y2="72"/>
    <line x1="128" y1="184" x2="128" y2="206"/>
    <line x1="50"  y1="128" x2="72"  y2="128"/>
    <line x1="184" y1="128" x2="206" y2="128"/>
    <line x1="72.8"  y1="72.8"  x2="88.4"  y2="88.4"/>
    <line x1="167.6" y1="167.6" x2="183.2" y2="183.2"/>
    <line x1="183.2" y1="72.8"  x2="167.6" y2="88.4"/>
    <line x1="88.4"  y1="167.6" x2="72.8"  y2="183.2"/>
  </g>
  <!-- 太阳本体 (暖色渐变) -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="42" fill="url(#sun)"/>
</svg>
